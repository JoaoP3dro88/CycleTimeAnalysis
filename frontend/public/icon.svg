<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Fundo circular escuro -->
  <circle cx="16" cy="16" r="16" fill="#0f1f0f"/>
  <!-- Círculo do relógio -->
  <circle cx="16" cy="16" r="11" stroke="#2ca02c" stroke-width="2" fill="none"/>
  <!-- Ponteiro de horas -->
  <line x1="16" y1="16" x2="16" y2="9" stroke="#2ca02c" stroke-width="2" stroke-linecap="round"/>
  <!-- Ponteiro de minutos -->
  <line x1="16" y1="16" x2="21" y2="16" stroke="#6fcf6f" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Centro -->
  <circle cx="16" cy="16" r="1.5" fill="#2ca02c"/>
</svg>
